spring.application.name=ETMDISS

spring.datasource.url=jdbc:mysql://localhost:3306/etmdiss?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=etm_user
spring.datasource.password=etm_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA \u914D\u7F6E\uFF08\u5982\u679C\u4F60\u4F7F\u7528\u7684\u662F Spring Data JPA\uFF09
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect